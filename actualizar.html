<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b5fa5">
  <title>Actualizar Calculadora LO₂</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      display: grid; place-items: center;
      background: #0b1d2b; color: #fff;
      font: 16px/1.5 system-ui, sans-serif; text-align: center;
    }
    main { width: min(100%, 520px); }
    h1 { font-size: 1.6rem; }
    p { color: #d5e0e8; }
    #status { margin: 24px 0; min-height: 3em; }
    a {
      display: inline-block; padding: 13px 20px; border-radius: 8px;
      background: #fff; color: #0b1d2b; text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Actualizar Calculadora LO₂</h1>
    <p>Esta página solicita la versión más reciente de la aplicación.</p>
    <p id="status" role="status" aria-live="polite">Comprobando actualización…</p>
    <a id="open" href="./">Abrir Calculadora LO₂</a>
  </main>
  <script>
    (async () => {
      const status = document.getElementById("status");
      const open = document.getElementById("open");
      const appUrl = new URL("./", location.href);
      appUrl.searchParams.set("actualizada", Date.now());
      open.href = appUrl.href;

      if (!("serviceWorker" in navigator)) {
        status.textContent = "Este navegador no admite la actualización automática. Pulsa «Abrir Calculadora LO₂».";
        return;
      }

      const waitForActivation = worker => new Promise((resolve, reject) => {
        if (worker.state === "activated") {
          resolve();
          return;
        }
        if (worker.state === "redundant") {
          reject(new Error("La instalación del Service Worker fue descartada."));
          return;
        }

        const timeout = setTimeout(() => {
          worker.removeEventListener("statechange", onStateChange);
          reject(new Error("La activación tardó demasiado."));
        }, 20000);

        const onStateChange = () => {
          if (worker.state === "activated") {
            clearTimeout(timeout);
            worker.removeEventListener("statechange", onStateChange);
            resolve();
          } else if (worker.state === "redundant") {
            clearTimeout(timeout);
            worker.removeEventListener("statechange", onStateChange);
            reject(new Error("La instalación del Service Worker fue descartada."));
          }
        };

        worker.addEventListener("statechange", onStateChange);
      });

      try {
        const registration = await navigator.serviceWorker.register("./service-worker.js", {
          updateViaCache: "none"
        });
        status.textContent = "Solicitando la versión más reciente…";
        await registration.update();

        const updatingWorker = registration.installing || registration.waiting;
        if (updatingWorker) {
          status.textContent = "Instalando la actualización…";
          await waitForActivation(updatingWorker);
        } else if (!registration.active) {
          await navigator.serviceWorker.ready;
        }

        status.textContent = "Comprobación terminada. Abriendo la pantalla de servicio suspendido…";
        setTimeout(() => location.replace(appUrl.href), 500);
      } catch (error) {
        status.textContent = "No se pudo confirmar la actualización automática. Puedes abrir la pantalla publicada con el botón.";
      }
    })();
  </script>
</body>
</html>

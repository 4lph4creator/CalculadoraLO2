<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b5fa5">
  <title>Calculadora LO₂ — Servicio suspendido</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; min-height: 100%; margin: 0;
      background: #0b1d2b;
    }
    body {
      min-height: 100vh; min-height: 100dvh;
      display: grid; place-items: center; overflow: auto;
    }
    main {
      display: grid; place-items: center;
      width: 100%; min-height: 100vh; min-height: 100dvh;
    }
    .poster {
      display: block; width: min(100%, 1200px); height: auto;
      max-height: 100vh; max-height: 100dvh; object-fit: contain;
    }
  </style>
</head>
<body>
  <main>
    <img
      class="poster"
      src="serviciosuspendido.jpeg"
      alt="Afiche de Calculadora LO₂: servicio suspendido. El isotanque se fue de vacaciones por tiempo indefinido."
    >
  </main>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js", { updateViaCache: "none" })
          .then(registration => registration.update())
          .catch(() => {});
      });
    }
  </script>
</body>
</html>

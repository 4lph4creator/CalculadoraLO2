<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b5fa5">
  <title>Calculadora LO₂ — Servicio suspendido</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #101923; color: #f3f6fa;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 480px); padding: 36px 28px; text-align: center;
      background: #182533; border: 1px solid #344658; border-radius: 18px;
      box-shadow: 0 18px 55px rgba(0,0,0,.28);
    }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 20px; display: grid;
      place-items: center; border: 1px solid #62778b; border-radius: 50%;
      color: #d9e5ef; font-size: 30px;
    }
    h1 { margin: 0 0 12px; font-size: clamp(24px, 6vw, 32px); letter-spacing: .04em; }
    .status {
      display: inline-block; margin: 8px 0 18px; padding: 7px 12px;
      border: 1px solid #bd8840; border-radius: 999px; color: #ffd18a;
      font-size: 12px; font-weight: 700; letter-spacing: .1em;
    }
    p { margin: 0; color: #c0ccd7; line-height: 1.6; }
    .vacation {
      margin: 24px 0 0; padding: 0; 
    }
    .art-slot {
      display: grid; place-items: center; gap: 8px;
      width: 100%; min-height: 190px; padding: 24px;
      border: 1px dashed #62778b; border-radius: 14px;
      background: #14212d; color: #d9e5ef;
    }
    .art-slot strong { font-size: 14px; }
    .art-slot span { color: #8293a3; font-size: 12px; }
    .vacation figcaption {
      margin-top: 12px; color: #c0ccd7; font-size: 14px; line-height: 1.5;
    }
    .foot { margin-top: 28px; color: #8293a3; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">Ⅱ</div>
    <h1>CALCULADORA LO₂</h1>
    <div class="status">SERVICIO SUSPENDIDO</div>
    <p>La aplicación se encuentra temporalmente fuera de servicio. El acceso a la herramienta ha sido suspendido por el administrador.</p>
    <figure class="vacation">
      <div class="art-slot" role="img" aria-label="Espacio reservado para la ilustración del isotanque en vacaciones">
        <strong>Ilustración del isotanque en vacaciones</strong>
        <span>Espacio reservado para incorporar la imagen</span>
      </div>
      <figcaption>Después de tantas descargas, nuestro isotanque se fue de vacaciones. ¡Nos vemos más adelante!</figcaption>
    </figure>
    <div class="foot">Calculadora LO₂</div>
  </main>
</body>
</html>
